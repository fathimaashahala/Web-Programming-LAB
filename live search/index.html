
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Live Search</h1>
        <p>Search for students instantly</p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search students..."
            autocomplete="off"
        >

        <div id="results">
            <p>Start typing to search...</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
