
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f4f8;
            text-align: center;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #172554;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #dc2626;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #991b1b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome!</h1>

    <h2>Hello, {{ username }}</h2>

    <p>You have successfully logged in.</p>

    <br>

    <a href="/logout">Logout</a>

</div>

</body>
</html>
