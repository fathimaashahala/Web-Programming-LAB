
<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4f8;
        }

        .container {
            width: 350px;
            max-width: 90%;
            margin: 80px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #172554;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        p {
            text-align: center;
        }

        .message {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Register</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/register">

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <input type="email"
               name="email"
               placeholder="Enter email"
               required>

        <input type="password"
               name="password"
               placeholder="Enter password"
               minlength="8"
               required>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
