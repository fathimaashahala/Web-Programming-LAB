
<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eaf0f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        p {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Us</h1>

        <p>Send us your message</p>

        <form action="/submit" method="POST">

            <label>Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Subject</label>
            <input type="text"
                   name="subject"
                   placeholder="Enter subject"
                   required>

            <label>Message</label>
            <textarea name="message"
                      rows="5"
                      placeholder="Enter your message"
                      required></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
